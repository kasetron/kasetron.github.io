<!DOCTYPE html>
<html lang="{{ site.LanguageCode }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Params.summary }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
  {{ $css := resources.Get "css/style.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ "/" | relURL }}">{{ site.Title }}</a>
    <nav><a href="{{ "/moduli/" | relURL }}">Modules</a><a href="{{ "/demos/" | relURL }}">Demos</a><a href="{{ "/workshop/" | relURL }}">Workshop</a></nav>
  </header>
  <main>{{ block "main" . }}{{ end }}</main>
  <footer>Circuits by <a href="https://www.eddybergman.com/">Eddy Bergman</a> unless stated otherwise. Build log by {{ site.Params.author }}.</footer>
</body>
</html>
